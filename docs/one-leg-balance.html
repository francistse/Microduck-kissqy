<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffbed">
<title>单脚独立 · 自训新突破 | Microduck</title>
<meta name="description" content="把训练里的平衡，带到真实的小鸭身上。Microduck 作者自训单脚独立实机演示。">
<style>
:root{color-scheme:light;--ink:#124943;--orange:#ff682e;--muted:#63756c;--paper:#fffbed}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 12% 6%,#fff1a4 0,transparent 47%),radial-gradient(ellipse at 90% 90%,#c9f4d7 0,transparent 49%),var(--paper);min-height:100svh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.topbar{max-width:1440px;margin:auto;padding:24px 5vw;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850;letter-spacing:-.5px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;background:var(--ink);border-radius:13px;color:#fff8dc;font-size:22px}
.back{display:flex;align-items:center;gap:9px;padding:11px 17px;border:1px solid #12494325;border-radius:100px;background:#ffffff7a;font-size:14px;font-weight:650}
.back:hover{background:#fff}
.layout{max-width:1240px;margin:0 auto;padding:14px 5vw 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,480px);gap:clamp(32px,7vw,112px);align-items:center}
.copy{padding-bottom:20px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:750;letter-spacing:2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 5px #ff682e15}
h1{font-size:clamp(64px,8.2vw,112px);line-height:1.06;letter-spacing:-5px;margin:26px 0 24px;font-weight:900}
h1 span{color:var(--orange)}
.description{font-size:clamp(17px,1.5vw,21px);line-height:1.9;max-width:390px;margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 36px}
.tag{font-size:14px;font-weight:650;padding:9px 14px;border-radius:100px;background:#fff9;border:1px solid #12494313}
.project-link{display:inline-flex;gap:12px;align-items:center;font-size:16px;font-weight:750;border-bottom:2px solid #ff682e66;padding-bottom:7px}
.project-link:hover{border-color:var(--orange)}
.player-wrap{position:relative;width:min(100%,calc((100svh - 210px)*9/16));justify-self:center}
.player{position:relative;padding:10px;background:#ffffffdf;border:1px solid #fff;border-radius:34px;box-shadow:0 22px 65px #1249431b,0 3px 8px #12494309}
video{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;background:#1b2925;border-radius:25px}
.play{position:absolute;inset:10px;border:0;border-radius:25px;display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent 45%,#082b2212);color:white}
.play-circle{display:grid;place-items:center;width:82px;height:82px;border-radius:50%;background:#fffef5ed;color:var(--ink);box-shadow:0 8px 32px #061c2930;transition:transform .2s,background .2s}
.play:hover .play-circle{transform:scale(1.08);background:#fff}
.play svg{width:29px;height:29px;margin-left:5px}
.play[hidden]{display:none}
.player-actions{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:18px}
.text-button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink);padding:8px 4px;font-size:14px;font-weight:650}
.text-button:hover{color:var(--orange)}
.status{min-height:1.5em;max-width:100%;font-size:14px;text-align:center;color:var(--muted);margin:5px 0 0}
:focus-visible{outline:3px solid var(--orange);outline-offset:5px}
@media(min-width:1600px){.layout{max-width:1380px;grid-template-columns:minmax(0,1fr) minmax(320px,560px)}}
@media(max-width:720px){
.topbar{padding:18px 20px}.brand{font-size:18px}.brand-mark{width:34px;height:34px}.back{font-size:13px;padding:10px 13px}
.layout{display:flex;flex-direction:column;padding:15px 18px 32px;gap:24px}
.copy{width:100%;padding:0;text-align:center}.eyebrow{font-size:13px}
h1{font-size:clamp(44px,13vw,72px);line-height:1.1;letter-spacing:-2px;margin:17px 0 14px}h1 br{display:none}
.description{font-size:15px;max-width:none;line-height:1.8}.tags{justify-content:center;margin:17px 0 0;gap:8px}.tag{font-size:12px;padding:7px 11px}.project-link{display:none}
.player-wrap{width:min(100%,440px)}.player{padding:8px;border-radius:29px}video{border-radius:21px}.play{inset:8px;border-radius:21px}.play-circle{width:72px;height:72px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="https://github.com/kissqy/Microduck-kissqy" aria-label="Microduck 项目首页"><span class="brand-mark" aria-hidden="true">🦆</span>Microduck</a>
<a class="back" href="https://github.com/kissqy/Microduck-kissqy"><span aria-hidden="true">↗</span> 返回项目</a>
</header>
<main class="layout">
<section class="copy">
<div class="eyebrow"><span class="dot" aria-hidden="true"></span>自训新突破</div>
<h1>单脚<br><span>独立。</span></h1>
<p class="description">把训练里的平衡，<br>带到真实的小鸭身上。</p>
<div class="tags"><span class="tag">作者自训</span><span class="tag">实机演示</span><span class="tag">强化学习</span></div>
<a class="project-link" href="https://github.com/kissqy/Microduck-kissqy">探索这只鸭子的更多玩法 <span aria-hidden="true">→</span></a>
</section>
<section class="player-wrap" aria-label="单脚独立实机视频">
<div class="player">
<video id="balance-video" controls playsinline preload="metadata" poster="assets/one-leg-balance-poster.webp">
<source src="https://github.com/user-attachments/assets/71fc2c95-8499-49f6-924b-837df42814cf" type="video/mp4">
</video>
<button id="play" class="play" type="button" aria-label="播放单脚独立实机视频"><span class="play-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3.5a1 1 0 0 1 1.5-.86l13 8a1 1 0 0 1 0 1.72l-13 8A1 1 0 0 1 6 19.5Z"/></svg></span></button>
</div>
<div class="player-actions"><button id="replay" class="text-button" type="button">↺ 重新播放</button><button id="fullscreen" class="text-button" type="button">⛶ 全屏观看</button></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
</section>
</main>
<script>
const video=document.getElementById('balance-video');
const play=document.getElementById('play');
const status=document.getElementById('status');
function start(){status.textContent='';video.play().catch(()=>{play.hidden=false;status.textContent='请点击视频中的播放按钮';});}
play.addEventListener('click',start);
video.addEventListener('play',()=>{play.hidden=true;status.textContent='';});
video.addEventListener('ended',()=>{play.hidden=false;});
video.addEventListener('error',()=>{play.hidden=true;status.textContent='视频暂未加载成功，请刷新后重试';});
document.getElementById('replay').addEventListener('click',()=>{video.currentTime=0;start();});
document.getElementById('fullscreen').addEventListener('click',async()=>{
try{if(video.requestFullscreen)await video.requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();}catch{}
});
</script>
</body>
</html>
