<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V167 原始界面 · connection</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../control.css"><link rel="stylesheet" href="../service.css"><link rel="stylesheet" href="../r17-0151.css"><link rel="stylesheet" href="../advanced-parameters.css"><link rel="stylesheet" href="../calibration-view.css"><style>html{scroll-behavior:auto}body{padding:14px;min-width:0;margin:0}.heading-actions{margin:0}.ssh-form{width:100%;margin:0}.service-editor{margin:0}.official-pad{max-width:390px;margin:auto}.panel{margin:0}#service-editor{width:100%}input,button,select{pointer-events:none}#service-job{display:none}.service-workbench-bottom{display:none}</style></head><body class="service-mode"><div inert><div class="heading-actions"><form id="ssh-form" class="ssh-form" autocomplete="off">
