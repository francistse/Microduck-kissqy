<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V167 原始界面 · pad</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../control.css"><link rel="stylesheet" href="../service.css"><link rel="stylesheet" href="../r17-0151.css"><link rel="stylesheet" href="../advanced-parameters.css"><link rel="stylesheet" href="../calibration-view.css"><style>html{scroll-behavior:auto}body{padding:14px;min-width:0;margin:0}.heading-actions{margin:0}.ssh-form{width:100%;margin:0}.service-editor{margin:0}.official-pad{max-width:390px;margin:auto}.panel{margin:0}#service-editor{width:100%}input,button,select{pointer-events:none}#service-job{display:none}.service-workbench-bottom{display:none}</style></head><body class="service-mode"><div inert><section id="control-panel" class="panel control-panel"><div class="panel-head"><h2>模拟手柄</h2></div><div class="official-pad">
        <div class="pad-shoulders"><button data-trigger="lt" title="LT：按住长叫并张嘴">LT · 长叫</button><button data-trigger="rt" title="RT：按下短叫并张嘴">RT · 短叫</button><button data-button="rb" data-requires-slot="kick_right" data-unavailable="true" title="RB：右脚踢球；等待运行模型回读">RB · 右脚踢球</button></div>
        <div class="pad-brand"><span>R17</span><small>模拟手柄 · 实体按键映射</small><button class="xbox-mark" data-button="guide" data-unavailable="true" title="官方 padd 未绑定 Guide">✥</button><i></i></div><div class="xbox-body"><div class="pad-stick" data-stick="l" tabindex="0" role="group" aria-label="左摇杆"><i></i><span>左摇杆</span></div>
          <div class="pad-center"><button data-button="select" title="短按松开卸力；按住 2 秒坐下并关机">Select<small>卸力 / 关机</small></button><button data-button="start" title="首次回 HOME；之后启用或关闭策略">Start<small>回位 / 策略</small></button></div>
          <div class="pad-abxy"><button class="pad-y" data-button="y" title="头部模式">Y</button><button class="pad-x" data-button="x" data-requires-slot="roulade" data-unavailable="true" title="X：前滚翻 10000 轮；等待运行模型回读">X</button><button class="pad-b" data-button="b" title="身体姿态模式">B</button><button class="pad-a" data-button="a" data-requires-slot="ground_pick" data-unavailable="true" title="A：低头捡物；等待运行模型回读">A</button></div>
          <div class="pad-dpad"><button data-dpad="dy:-1" data-unavailable="true" title="本机未配置轮式模式">↑</button><button data-dpad="dx:-1" data-unavailable="true" title="官方未绑定此方向">←</button><button data-dpad="dx:1" data-unavailable="true" title="飞特后端不支持官方舵机重启指令">→</button><button data-dpad="dy:1" title="10000 轮起坐模型">↓</button></div>
          <div class="pad-stick" data-stick="r" tabindex="0" role="group" aria-label="右摇杆"><i></i><span>右摇杆</span></div>
          <div class="pad-stick-clicks"><button data-button="ls" data-unavailable="true" title="仅实体手柄：滑轮模式且 IMU 确认倒地时，按 L3 测试起身 5 秒">L3</button><button data-button="rs" data-unavailable="true" title="官方未绑定右摇杆按压">R3</button><button data-pad-center>摇杆回中</button></div>
        </div>
      </div></section></div></body></html>
