<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V167 原始界面 · firmware</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../control.css"><link rel="stylesheet" href="../service.css"><link rel="stylesheet" href="../r17-0151.css"><link rel="stylesheet" href="../advanced-parameters.css"><link rel="stylesheet" href="../calibration-view.css"><style>html{scroll-behavior:auto}body{padding:14px;min-width:0;margin:0}.heading-actions{margin:0}.ssh-form{width:100%;margin:0}.service-editor{margin:0}.official-pad{max-width:390px;margin:auto}.panel{margin:0}#service-editor{width:100%}input,button,select{pointer-events:none}#service-job{display:none}.service-workbench-bottom{display:none}</style></head><body class="service-mode"><div inert><section class="panel firmware-card" id="service-firmware"><div class="panel-head"><div><span class="section-index">09</span><h2>系统维护</h2></div><span class="badge neutral">R17 · 官方 0.15.1</span></div>
      <div class="firmware-body"><p id="firmware-runtime" class="tiny muted">实际运行版本：等待机器人回读</p>
      <div class="firmware-toolbar"><button class="button" id="firmware-bundled">随包固件 · 正在核验</button>
      <div class="firmware-upload"><input id="firmware-file" type="file" accept=".zip" aria-label="本地固件 ZIP" hidden><button class="button" id="firmware-choose">选择 ZIP 文件</button><span id="firmware-filename" class="tiny muted">尚未选择文件</span></div><div class="service-action-row firmware-install-actions"><button class="button accent" id="firmware-flash" disabled>升级所选固件</button></div></div>
      <p class="tiny muted">升级保留本机标定、已安装模型及参数；首次安装使用随包自训模型。安装后不自动回 HOME 或启动策略。</p>
      <p id="firmware-verification" class="tiny muted" role="status">正在校验随包固件…</p>
      <div id="firmware-status" class="panel-note service-job" role="status" aria-live="polite"></div>
      <div id="firmware-transfer" hidden><progress id="firmware-progress" max="100" value="0" aria-label="固件上传进度"></progress><p id="firmware-progress-text" class="tiny muted" role="status"></p></div>
      <div class="firmware-power"></div></div></section></div></body></html>
